name: GCP validation
on:
  pull_request:
    paths:
      - 'infra/gcp/**'
      - 'infra/eks-eso/helm-values*.yaml'
      - 'infra/eks-eso/scripts/post_renderer.py'
      - 'scripts/*gcp*'
      - 'scripts/render-platform.py'
      - 'tests/**'
      - 'requirements-dev.txt'
      - '.github/workflows/gcp-validation.yml'
  push:
    branches: [main]
    paths:
      - 'infra/gcp/**'
      - 'infra/eks-eso/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements-dev.txt'
      - '.github/workflows/gcp-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: terraform fmt -check -recursive infra/gcp
      - run: terraform -chdir=infra/gcp init -backend=false -input=false
      - run: terraform -chdir=infra/gcp validate
      - run: terraform -chdir=infra/gcp test
      - run: terraform -chdir=infra/gcp/bootstrap init -backend=false -input=false
      - run: terraform -chdir=infra/gcp/bootstrap validate
